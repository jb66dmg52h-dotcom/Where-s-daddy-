[env:esp32-s3-lcd-147]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200

lib_deps =
  lvgl/lvgl@^8.3.11
  bodmer/TFT_eSPI@^2.5.43

build_flags =
  -D LV_CONF_INCLUDE_SIMPLE
  -D USER_SETUP_LOADED
  -D ST7789_DRIVER
  -D TFT_WIDTH=172
  -D TFT_HEIGHT=320
  -D TFT_MOSI=11
  -D TFT_SCLK=12
  -D TFT_CS=10
  -D TFT_DC=13
  -D TFT_RST=14
  -D TFT_BL=15
  -D TFT_BACKLIGHT_ON=HIGH
  -D SPI_FREQUENCY=40000000
  -D LOAD_GLCD
  -D SMOOTH_FONT

